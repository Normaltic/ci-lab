name: sync dev

on:
  push:
    branches:
      - stage

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[manually skip]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage
          fetch-depth: 300
          # GITHUB_TOKEN 으로 만든 push 는 다른 workflow 를 깨우지 않으므로 PAT 사용
          token: ${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN }}
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin dev
          git checkout dev
          git merge origin/stage -m "Merge branch 'stage' into dev"
          git push origin dev
