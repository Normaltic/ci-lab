name: release

on:
  push:
    branches:
      - main
      - stage
  pull_request:
    branches:
      - main
      - stage
      - dev
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TARGET: ${{ (github.ref == 'refs/heads/main' && 'prod') || (github.ref == 'refs/heads/stage' && 'stage') || 'preview' }}
  SCALE: ${{ vars.STUB_SCALE || '1' }}

jobs:
  # 릴리즈 커밋([manually skip])이면 이 job 이 skip 되고 하위 job 이 연쇄 skip 된다
  gate:
    if: ${{ !contains(github.event.head_commit.message, '[manually skip]') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "event=${{ github.event_name }}"

  scope:
    needs: [gate]
    if: ${{ !(github.event_name == 'pull_request' && (github.head_ref == 'stage' || github.head_ref == 'main')) }}
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - id: decide
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then echo "mode=full" >> "$GITHUB_OUTPUT"; else echo "mode=changed" >> "$GITHUB_OUTPUT"; fi

  plan:
    needs: [scope]
    if: needs.scope.outputs.mode == 'changed'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - id: plan
        run: |
          echo 'shards=[1,2]' >> "$GITHUB_OUTPUT"
          echo 'total=2' >> "$GITHUB_OUTPUT"

  verify-full:
    needs: [scope]
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2]
    steps:
      - run: sleep $((150 * SCALE)); test "${{ vars.FAIL_VERIFY }}" != "true"

  verify-changed:
    needs: [scope, plan]
    if: needs.scope.outputs.mode == 'changed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards || '[1]') }}
    steps:
      - run: sleep $((30 * SCALE))

  verify-int:
    needs: [scope]
    runs-on: ubuntu-latest
    steps:
      - run: sleep $((90 * SCALE))

  lint:
    needs: [scope]
    runs-on: ubuntu-latest
    steps:
      - run: sleep $((180 * SCALE))

  # verify-changed 를 넣으면 그 skip 이 연쇄해 릴리즈가 돌지 않는다
  release:
    needs: [verify-full, verify-int, lint]
    runs-on: ubuntu-latest
    outputs:
      git-head: ${{ steps.sr.outputs.NEXT_RELEASE_GIT_HEAD }}
      version: ${{ steps.sr.outputs.NEXT_RELEASE_VERSION }}
      releasable: ${{ steps.sr.outputs.RELEASABLE }}
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: sr
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN }}
        run: npx semantic-release

  build:
    needs: [release]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage') && github.event_name == 'push' && needs.release.outputs.releasable == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.release.outputs.version }}
    steps:
      - run: |
          echo "build ${{ needs.release.outputs.version }} ($TARGET)"
          sleep 30

  side-trigger:
    needs: [release]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage') && github.event_name == 'push' && needs.release.outputs.releasable == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [a, b]
    steps:
      - run: echo "trigger ${{ matrix.variant }} ${{ needs.release.outputs.version }}"

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage') && github.event_name == 'push' && needs.release.outputs.releasable == 'true'
    steps:
      - run: |
          echo "deploy ${{ needs.build.outputs.version }} ($TARGET)"
          echo "### deployed ${{ needs.build.outputs.version }} ($TARGET)" >> "$GITHUB_STEP_SUMMARY"
          sleep 30

  notify-failure:
    if: ${{ (failure() || cancelled()) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage') }}
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::warning::NOTIFY $TARGET 배포 실패"
          echo "### NOTIFY: 배포 실패 알림" >> "$GITHUB_STEP_SUMMARY"

  update-manifest:
    runs-on: ubuntu-latest
    needs: [release, build]
    if: ${{ needs.release.outputs.releasable == 'true' }}
    steps:
      - run: |
          echo "manifest ${{ github.ref_name == 'main' && 'prod' || 'stage' }} <- ${{ needs.release.outputs.version }}"
          echo "### manifest <- ${{ needs.release.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  lock-stage:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      id: ${{ steps.lock.outputs.id }}
    steps:
      - id: lock
        run: echo "id=lock-1" >> "$GITHUB_OUTPUT"

  unlock-stage:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && always()
    needs: [lock-stage, release]
    steps:
      - run: echo "unlock ${{ needs.lock-stage.outputs.id }}"
