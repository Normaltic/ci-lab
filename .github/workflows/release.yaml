name: release

on:
  push:
    branches:
      - main
      - stage
  pull_request:
    branches:
      - main
      - stage
      - dev
    types: [opened, synchronize, reopened, ready_for_review]

# PR 만 run 단위로 묶는다. push 는 run 마다 고유 그룹이라 서로 기다리지 않고, 직렬화는 아래 job 단위 그룹이 맡는다
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TARGET: ${{ (github.ref == 'refs/heads/main' && 'prod') || (github.ref == 'refs/heads/stage' && 'stage') || 'preview' }}

jobs:
  # 릴리즈 커밋([manually skip])이면 이 job 이 skip 되고 하위 job 이 연쇄 skip 된다
  gate:
    if: ${{ !contains(github.event.head_commit.message, '[manually skip]') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "event=${{ github.event_name }}"

  # stage 는 새 push 가 오면 앞 run 의 검증을 취소한다 — 뒤 run 의 release 가 앞 커밋까지 함께 릴리즈한다
  verify:
    needs: [gate]
    uses: ./.github/workflows/release-verify.yaml
    concurrency:
      group: ${{ github.workflow }}-verify-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

  # release~배포를 한 job 으로 묶어 락을 잡는다. job 마다 잡으면 앞뒤 run 의 build/deploy 가 엇갈린다
  publish:
    needs: [verify, lock-stage]
    # stage 에선 lock-stage 가 skip 이라 기본 조건으로는 publish 가 연쇄 skip 된다
    if: ${{ !cancelled() && needs.verify.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage') }}
    uses: ./.github/workflows/release-publish.yaml
    with:
      lock-id: ${{ needs.lock-stage.outputs.id }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    concurrency:
      group: ${{ github.workflow }}-publish-${{ github.ref }}
      cancel-in-progress: false

  # stage 는 검증 취소가 정상 경로라 cancelled 로는 알리지 않는다
  notify-failure:
    if: ${{ (failure() || (cancelled() && github.ref == 'refs/heads/main')) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage') }}
    needs: [verify, publish]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::warning::NOTIFY $TARGET 배포 실패"
          echo "### NOTIFY: 배포 실패 알림" >> "$GITHUB_STEP_SUMMARY"

  lock-stage:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      id: ${{ steps.lock.outputs.id }}
    steps:
      - id: lock
        run: echo "id=lock-1" >> "$GITHUB_OUTPUT"

  # publish 가 돌지 못했거나 실패한 경우의 안전망. 정상 경로의 해제는 publish 안에서 release 직후에 한다
  unlock-stage-fallback:
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main' && needs.publish.result != 'success'
    needs: [lock-stage, publish]
    steps:
      - run: echo "unlock ${{ needs.lock-stage.outputs.id }} (fallback) $(date -u +%T)"
