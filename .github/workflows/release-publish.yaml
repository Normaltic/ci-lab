name: release-publish

on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.release.outputs.version }}
      releasable:
        value: ${{ jobs.release.outputs.releasable }}

env:
  TARGET: ${{ (github.ref == 'refs/heads/main' && 'prod') || (github.ref == 'refs/heads/stage' && 'stage') || 'preview' }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      git-head: ${{ steps.sr.outputs.NEXT_RELEASE_GIT_HEAD }}
      version: ${{ steps.sr.outputs.NEXT_RELEASE_VERSION }}
      releasable: ${{ steps.sr.outputs.RELEASABLE }}
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: sr
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN }}
        run: npx semantic-release

  build:
    needs: [release]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage') && github.event_name == 'push' && needs.release.outputs.releasable == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.release.outputs.version }}
    steps:
      - run: |
          echo "build ${{ needs.release.outputs.version }} ($TARGET)"
          sleep 30

  side-trigger:
    needs: [release]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage') && github.event_name == 'push' && needs.release.outputs.releasable == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [a, b]
    steps:
      - run: echo "trigger ${{ matrix.variant }} ${{ needs.release.outputs.version }}"

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage') && github.event_name == 'push' && needs.release.outputs.releasable == 'true'
    steps:
      - run: |
          echo "deploy ${{ needs.build.outputs.version }} ($TARGET)"
          sleep ${{ vars.DEPLOY_SLEEP || '30' }}
          echo "### deployed ${{ needs.build.outputs.version }} ($TARGET)" >> "$GITHUB_STEP_SUMMARY"

  update-manifest:
    runs-on: ubuntu-latest
    needs: [release, build]
    if: ${{ needs.release.outputs.releasable == 'true' }}
    steps:
      - run: |
          echo "manifest ${{ github.ref_name == 'main' && 'prod' || 'stage' }} <- ${{ needs.release.outputs.version }}"
          echo "### manifest <- ${{ needs.release.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
